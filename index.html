<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자재 거래 내역 관리</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📦 자재 구매 내역 관리</h1>
            <p>로컬 데이터 기반 안전하고 빠른 거래 대장</p>
        </header>

        <main>
            <!-- 입력 섹션 (영수증 형태) -->
            <section class="card input-section">
                <h2>새 거래 등록</h2>
                <div class="form-group date-group">
                    <label for="transactionDate">거래일자</label>
                    <input type="date" id="transactionDate" required>
                </div>
                
                <div class="items-wrapper">
                    <div class="items-header">
                        <span>품목명</span>
                        <span>수량</span>
                        <span>개당단가 (원)</span>
                        <span>총액 (원)</span>
                        <span></span>
                    </div>
                    <div id="itemsContainer">
                        <!-- 품목 입력 행들이 동적으로 추가될 영역 -->
                    </div>
                </div>
                
                <div class="form-actions">
                    <button type="button" id="addItemBtn" class="btn-secondary">+ 품목 추가</button>
                    <div class="grand-total-display">
                        영수증 총계: <span id="receiptTotal">0</span> 원
                    </div>
                </div>

                <button type="button" id="saveTransactionBtn" class="btn-primary">저장하기</button>
            </section>

            <!-- 리스트 섹션 -->
            <section class="card list-section">
                <div class="list-header-row">
                    <h2>거래 내역 조회</h2>
                    <button type="button" id="exportCsvBtn" class="btn-outline">📥 CSV 백업</button>
                </div>
                
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th class="sortable" id="sortDateBtn">
                                    거래일자 <span class="sort-icon">↓</span>
                                </th>
                                <th>품목</th>
                                <th>수량</th>
                                <th>개당단가</th>
                                <th>총액</th>
                                <th>관리</th>
                            </tr>
                        </thead>
                        <tbody id="dataTableBody">
                            <!-- 데이터가 동적으로 들어갈 영역 -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <template id="itemRowTemplate">
        <div class="item-row">
            <input type="text" class="item-name" placeholder="예: 개별멀티탭" required>
            <input type="number" class="item-qty" placeholder="0" min="1" required>
            <input type="number" class="item-price" placeholder="0" min="0" required>
            <div class="item-total">0</div>
            <button type="button" class="btn-delete" title="삭제">✕</button>
        </div>
    </template>

    <script src="script.js"></script>
</body>
</html>
